# ====== Default Configuration ======
# DO NOT directly modify the following parameters
# Put your own setting in config_edit_me.yaml instead.
# --------------------------------------

bot:
  # 🔁 Bot Settings
  mode: "normal"        # Options: "normal" "aux" "patrol" "debug"
  attack: "directional" # Options: "aoe_skill" "directional"
  map: "" # Please refer to config/config_data.yaml

capture:
  # Windows default: read the GC573 directly through OpenCV's DirectShow
  # backend. Set this to "window" only for the legacy window-capture path.
  source: "directshow"          # directshow | window

capture_card:
  device_index: 0               # Current GC573 DirectShow device index.
  device_name: "AVerMedia GC573 1 Capture" # Diagnostic friendly name.
  width: 3840
  height: 2160
  fps: 60
  pixel_format: "RGB24"         # DirectShow MEDIASUBTYPE_RGB24; OpenCV exposes BGR arrays.
  frame_timeout: 1.0            # Invalidate stale video and release remote input.
  startup_timeout: 3.0
  shutdown_timeout: 2.0
  read_retry_interval: 0.01

esp32_hid:
  # All simulated keyboard output is sent over USB serial to the ESP32-S3,
  # which forwards it to the paired computer as a physical Bluetooth LE HID keyboard.
  # "auto" matches an ESP32-S3 USB Serial/JTAG device (VID 303A, PID 1001).
  # ESP32_HID_SERIAL_PORT and ESP32_HID_SERIAL_BAUDRATE override these values.
  remote_target: True         # True when BLE is paired to a separate game PC.
  serial_port: "auto"         # Or set a fixed Windows port, for example "COM6".
  baudrate: 115200            # USB Serial/JTAG ignores line rate; kept for host compatibility.
  connect_timeout: 1.0
  request_timeout: 2.0       # Must be longer than the longest key tap.
  heartbeat_interval: 1.0    # Firmware releases all keys if its 3 s lease expires.
  reconnect_interval: 0.5
  state_refresh_interval: 1.0 # Reassert held movement after a brief BLE reconnect.
  # Absolute mouse geometry on the BLE target. The GC573 sees Magpie's scaled
  # 4K output, while Windows input must land inside Magpie's original 1366x768
  # source client. Map capture coordinates back through that physical source
  # rectangle before normalizing them to absolute HID coordinates.
  capture_frame_is_desktop: false
  absolute_desktop_rect: [0, 0, 3840, 2160]
  magpie_source_rect: [1235, 721, 1366, 768]

auto_relogin:
  # Recover an already authenticated Chinese Artale session with RapidOCR.
  # No page image template is loaded or matched, and this flow never stores or
  # types an account password.
  enable: True
  # Enter recovery only while the minimap is absent. React to whichever OCR
  # page is currently visible and keep scanning forever until it returns.
  reactive_pages: true
  template_reference_size: [700, 1296] # Legacy login_button_*.png native [height, width].
  flow_template_reference_size: [2160, 3840] # OCR/click coordinate reference [height, width].
  confirm_frames: 2              # Consecutive OCR page matches before each action.
  confirm_seconds: 0.5           # The OCR page must remain stable for this long.
  cancel_confirm_misses: 2       # Distinct misses needed to cancel an unacted false positive.
  input_retry_delay: 1.0         # Retry a definite local/HID send failure after this delay.
  retry_cooldown: 3.0            # Minimum wait before retrying an action on the same page.
  # The following bounds apply only when reactive_pages is explicitly disabled.
  step_timeout: 60.0
  game_ready_timeout: 60.0
  max_recovery_duration: 300.0
  max_step_attempts: 5
  game_ready_confirm_frames: 2
  mouse_click_duration: 0.10     # Slightly longer BLE click for remote game UI reliability.
  channel_click_count: 2         # Enter a displayed channel with a real double-click.
  channel_double_click_interval: 0.08 # Delay between the two channel clicks.
  # Remote game-UI clicks use calibrated absolute HID. visual_relative is an
  # explicit compatibility mode only and is not selected by shipped profiles.
  remote_mouse_mode: absolute # absolute | visual_relative
  cursor_template: "misc/auto_relogin_cursor_cn.png" # Large hand cursor for world/channel/character pages.
  cursor_hotspot: [14, 6]        # Click hotspot inside the large 4K template.
  disconnect_cursor_template: "misc/auto_relogin_cursor_small_cn.png" # Compact title/disconnect cursor.
  disconnect_cursor_hotspot: [10, 4] # Click hotspot inside the compact 4K template.
  cursor_min_score: 0.90         # Masked match confidence; higher is stricter.
  cursor_uniqueness_margin: 0.02 # Reject ambiguous duplicate cursor candidates.
  cursor_mask_erode_pixels: 1    # Ignore anti-aliased edge pixels blended with the hover background.
  cursor_min_visible_fraction: 0.25 # Allow one-edge clipping only with enough evidence.
  cursor_min_visible_pixels: 37 # Area-scaled for the 3840x2160 cursor mask.
  cursor_search_region: [0, 0, 3840, 2160]
  cursor_local_search_radius: [483, 483] # Fast search around the previous hotspot.
  mouse_move_gain: 0.35          # Capture-pixel error converted to each HID nudge.
  mouse_max_delta: 64            # <=127 keeps every feedback step to one HID report.
  mouse_target_tolerance: [19, 19] # Hotspot must be this close to the target.
  mouse_target_confirm_frames: 2 # Fresh aligned frames required before clicking.
  mouse_probe_delta: 8          # Inward HID probe used to prove cursor identity.
  mouse_response_min_pixels: 2  # Probe/steering response must visibly move.
  mouse_response_min_cosine: 0.50 # Observed motion must follow command direction.
  mouse_uncommanded_jump_tolerance: [6, 6] # Re-probe after an unexplained jump.
  mouse_feedback_delay: 0.20     # Wait for display/capture latency after each move.
  mouse_feedback_frames: 1       # Also require this many fresh capture frames.
  mouse_click_frame_max_age: 1.0 # Never click from an old processed capture.
  mouse_pointer_timeout: 60.0
  mouse_max_moves: 40
  mouse_cursor_miss_limit: 5
  mouse_page_miss_limit: 3
  mouse_stall_limit: 4
  mouse_target_drift: [54, 54]
  mouse_hover_template_correlation: 0.55 # Structural guard for hovered target buttons.
  # Safe no-click recovery for a cursor lost on the monitor to the left:
  # move far right twice, inset from the clipped edge, then scan vertically.
  # Large rescue deltas are split into ordinary relative reports by the ESP32.
  mouse_cursor_rescue_search_width: 3840 # Search the full frame after every rescue move.
  mouse_cursor_rescue_deltas:
    - [4096, 0]
    - [4096, 0]
    - [-127, 0]
    - [0, -64]
    - [0, 128]
    - [0, -192]
    - [0, 256]
    - [0, -320]
    - [0, 384]
    - [0, -448]
    - [0, 512]
  # Keep sending one OCR-authorized Enter at a time while the connection page
  # remains visible. Stop immediately when the world-selection page appears.
  connect_enter_retry_delay: 1.0
  connect_enter_max_attempts: 30 # Ordered compatibility mode only.
  remote_confirm_key: "enter"    # Key sent only after a configured OCR key-action gate.
  # Every page is classified and authorized from Chinese OCR alone.
  # Missing, duplicate, low-confidence, or moving targets never emit input.
  ocr:
    enable: true
    idle_scan_interval: 1.0      # OCR cadence while no recovery page is active.
    min_score: 0.80             # Allow the stylized Chinese login artwork while retaining exact page targets.
    box_threshold: 0.30
    confirm_frames: 2
    max_center_drift: [24, 24]
    max_frame_age: 5.0           # Includes cold/warm 4K OCR inference time; still requires fresh distinct frames.
    # Each page entry describes aliases for one semantic target, not several
    # nearby alternatives; duplicate spatial matches are rejected.
    targets:
      disconnect:
        texts: ["与服务器连接发生错误"]
        region_source: configured
        search_region: [1341, 644, 2468, 1234]
        match_mode: contains
        action: enter
      connect:
        texts: ["连接"]
        region_source: configured
        search_region: [1824, 912, 2360, 1234]
        match_mode: exact
        action: enter              # Repeat Enter until the world page appears.
      world:
        texts: ["4.漂漂猪"]
        region_source: configured
        search_region: [1931, 322, 2629, 590]
        match_mode: exact
        action: click
      channel:
        texts: ["漂漂猪"]
        region_source: configured
        search_region: [1288, 751, 2092, 1127]
        match_mode: exact
        action: fixed_click
      queue:
        texts: ["正在排队进入游戏"]
        region_source: configured
        search_region: [1600, 900, 2250, 1040]
        match_mode: contains
        action: wait               # Observe only; never cancel or send input while queued.
      character:
        texts: ["开始游戏"]
        region_source: configured
        search_region: [2468, 537, 3165, 1019]
        match_mode: exact
        action: click
  # The initial server grid contains only "4.漂漂猪" and blank wooden rows.
  # Clicking that world opens a separate panel whose OCR marker is the exact
  # unnumbered "漂漂猪" above 20 channel cells. Only then choose a cell and
  # double-click it.
  channel_points:
    - [1545, 1057]
    - [1786, 1057]
    - [2039, 1057]
    - [2291, 1057]
    - [1545, 1148]
    - [1786, 1148]
    - [2039, 1148]
    - [2291, 1148]
    - [1545, 1239]
    - [1786, 1239]
    - [2039, 1239]
    - [2291, 1239]
    - [1545, 1331]
    - [1786, 1331]
    - [2039, 1331]
    - [2291, 1331]
    - [1545, 1422]
    - [1786, 1422]
    - [2039, 1422]
    - [2291, 1422]

key:
  # 🎮 Keyboard Mapping
  # Adjust the keys to match your in-game keybindings.
  #
  # Examples:
  #   - "q":      Presses key Q
  #   - "space":  Space bar
  #   - "1":      Number key 1
  #   - "ctrl":   Control key
  #   - "alt":    Alt key
  #   - "shift":  Shift key
  aoe_skill: "shift"            # 💥 AoE skill; also used by directional_aoe
  directional_attack: "w"   # ⚔️ Basic directional attack (e.g., Magic Claw or throwing stars)
  power_knockback: "s"      # 🏹 Archer Power Knock-Back for monsters that are too close
  teleport: "e"             # 🌀 Teleport skill. Set to "" if not usable
  jump: "space"             # 🦘 Jump key
  add_hp: "1"               # ❤️ Use HP potion. Set to "" to disable auto-healing
  add_mp: "2"               # 💧 Use MP potion. Set to "" to disable auto-mana
  return_home: "home"       # 🔁 Key to use return home scroll.
  party: "p"                # ⌨️ Party window shortcut

buff_skill:
  # 💫 Buff Skill
  # Automatically apply buff skills when the cooldowns are ready.
  # Buff skills are like: Mage's Magic Guard, Cleric's Angel's Blessing, Thief's Speed Boost
  # ⚠️ Note: If your have a pet to apply buff for you, you can ignore this.
  keys: ["insert"]        # ⌨️ List of keys to cast each buff skill (e.g., ["a", "s"])
  cooldown: [600]         # ⏱️ Cooldown time (in seconds), matches the order of `keys`
  action_cooldown: 1      # 🕒 Delay (in seconds) after buffing before continuing actions

directional_attack:
  # 🗡️ Directional Attack
  # Directional attacks are basic attack/skills that only attack player left or right.
  # For examples, Mage’s Magic Claw, Thief’s dart throw, or even a snail shell toss are all directional attack
  range_x: 350               # ↔️ Horizontal attack range (in pixels)
  range_y: 70                # ↕️ Vertical attack range (in pixels)
  cooldown: 0.9              # ⏱️ Time between attacks (in seconds)
  character_turn_delay: 0.08 # 🔄 Hold a new facing direction before attacking
  attack_recovery_delay: 0.90 # 🏹 Block every other input after attack TAP completes

power_knockback:
  # 🏹 Archer close-range fallback (Power Knock-Back / 强力击退)
  # A monster inside trigger_distance_x blocks bow attacks on that whole side.
  # If the other side has a shootable monster, the bot attacks that side first.
  enable: true                 # Set false for non-archer directional builds
  trigger_distance_x: 100     # ↔️ Inclusive center-to-center close distance (pixels)
  range_y: 70                 # ↕️ Total vertical detection range (pixels)
  cooldown: 0.9               # ⏱️ Minimum time between Power Knock-Back uses
  attack_recovery_delay: 0.90 # 🏹 Block every other input after the S TAP completes
directional_aoe:
  # 🏹 Single-sided AoE (for example, an archer's multi-target skill)
  # While bot.attack is "directional", count monsters separately on each side.
  # A qualifying side uses key.aoe_skill instead of the normal attack key.
  enable: true                # Set true to enable normal/AoE hybrid attacks
  min_monsters: 2              # Minimum monsters on one side (inclusive)
  range_x: 350                 # ↔️ One-sided horizontal skill range (in pixels)
  range_y: 70                  # ↕️ Vertical skill range (in pixels)
  cooldown: 0.9                # ⏱️ Time between directional AoE casts (in seconds)
  attack_recovery_delay: 0.90  # 🏹 Block other input after the AoE TAP completes

aoe_skill:
  # 💥 AoE Skill
  # AoE (Area of Effect) skills hit enemies no matter which direction the chrarcter is facing.
  # For examples: Cleric’s Heal, Holy light, Mage’s Lightning Bolt are all AOE skills 
  range_x: 400               # ↔️ Horizontal skill range (in pixels)
  range_y: 170               # ↕️ Vertical skill range (in pixels)
  cooldown: 0.05             # TODO: Currently just a filler

health_monitor:
  # ❤️ Health Monitor
  # Automatically drinks HP/MP potions when health or mana drops below a threshold.
  # ⚠️ If your pet already handles auto-healing, you can disable this.
  enable: True             # ✅ Enable or disable health monitor
  force_heal: False        # 🛡️ Heal first — stop attacking until HP is restored
  add_hp_percent: 50       # ❤️ Drink HP potion when HP drops below this ratio [0.0 ~ 1.0]
  add_mp_percent: 50       # 💙 Drink MP potion when MP drops below this ratio [0.0 ~ 1.0]
  add_hp_cooldown: 0.5     # 🕒 Seconds to wait between HP potions, prevent potion spam
  add_mp_cooldown: 0.5     # 🕒 Seconds to wait between MP potions, prevent potion spam
  fps_limit: 20            # 🚥 Loop rate for the health monitor thread
  return_home_if_no_potion: False      # ✅ Use homing scroll when potion is used up
  return_home_watch_dog_timeout: 3     # 🕒 Duration to detect HP is lower than "add_hp_percent"

teleport:
  # 🌀 Mage Teleport
  # This feature lets Mages use teleport to move faster while walking.
  # ⚠️ Still experimental! Enabling it may cause unexpected issues.
  is_use_teleport_to_walk: False  # ✅ Use teleport while walking (may cause inaccurate pathing)
  cooldown: 1                     # ⏱️ Teleport skill cooldown (in seconds)

edge_teleport:
  # 🧙‍♂️ Edge Teleport
  # When your character approaches the edge of a platform, teleport to the platform center.
  # If your character isn't a Mage, it will perform a jump instead.
  enable: True                 # ✅ Enable or disable this feature
  trigger_box_width: 20        # ↔️ Width of the edge detection box (in pixels)
  trigger_box_height: 10       # ↕️ Height of the edge detection box (in pixels)
  color_code: [255, 127, 127]  # 🎨 RGB color code to represent platform edge

party_red_bar:
  # ❤️ Party Red Bar Detection
  # Detects your character's party red on on the game window to estimate player location.
  # This feature will only turn on when nametag.enable == False
  lower_red: [0, 60, 60]   # ❤️ HSV, darker red of party health bar
  upper_red: [0, 100, 100] # ❤️ HSV, brighter red of party health bar
  offset: [20, 66]         # 🎯 Offset from the top-left corner of the party red bar to the character center
  create_party_button_cn_thres: 0.04   # 📏 threshold for create party button matching
  create_party_button_eng_thres: 0.04 # 📏 threshold for create party button matching

nametag:
  # 🏷️ NameTag Recognition
  # ⚠️ This feature is deprecated, using party red bar is way better than detecting nametag.
  # Detects your character's nametag on the game window to estimate player location.
  enable: False   # ✅ Only switch back to 'True' when party red bar detection doesn't work for you
  name: "example" # Load nametag/<name>.png as nametag template
  mode: "grayscale"  # 🧪 Comparison mode for matching the nametag, Options: "grayscale" "white_mask" "histogram_eq"
  offset: [-50, 30]  # 🎯 Pixel offset from the top-left corner of the matched nametag to the character center 
  diff_thres: 0.15    # 📏 Matching threshold [0.0 ~ 1.0]; lower is stricter (SQDIFF)

  global_diff_thres: 0.2  # 🧠 Global detection fallback
  # If the diff is higher than this threshold, do a full-frame search.
  # If lower, search near the last known location to save time.
  # Set to 0.0 to disable this optimization

  split_width: 30  # ✂️ pixels width of each vertical split
  # To avoid occlusion from ladders or background objects,
  # the nametag will be split vertically and matched in smaller parts.
  cache_accept_thres: 0.12 # Cached scores above this are verified globally
  max_stale_frames: 2      # Draw the last box briefly; stale points never control combat
  jump_confirm_distance: 40 # Larger screen-space jumps must repeat before acceptance
  jump_confirm_radius: 12   # Maximum difference between two pending jump candidates

  # Screen-space Hero anchor detected by the shared mob/Hero YOLO model.
  overhead_marker:
    enable: True
    backend: "yolo"
    name: ""                    # Empty loads nametag/<name>_overhead_smile.png
    diff_thres: 0.02            # Masked SQDIFF threshold; lower is stricter
    white_lower: [185, 185, 185] # BGR lower bound for the white bubble
    component_width: 37         # White component size at the legacy 1296x700 frame
    component_height: 30
    component_size_tolerance: 0.20
    min_fill_rate: 0.60
    max_fill_rate: 0.90
    match_search_tolerance: 2   # Verify a few pixels around the component alignment
    player_offset: [18, 71]     # White-component top-left to existing Hero coordinate
    local_search_radius: 90     # YOLO multi-box choice must stay near the previous single-box Hero
    global_confirm_frames: 2    # Cold global matches must repeat before acceptance
    global_confirm_radius: 24   # Maximum movement between cold YOLO confirmations
    max_stale_frames: -1        # YOLO only: -1 retains the last location without a frame limit
    require_minimap_player: True # YOLO only: reject login/UI false positives without own minimap dot
    # A missing own-player minimap dot still invalidates the cached Hero immediately.
    require_unique_local: True  # Reject two identical bubbles near the cached Hero
    require_unique_global: True # Reject multiple candidates without accepted/single-box history
    yolo:
      class_name: "hero"
      confidence: 0.85           # Independent Hero threshold; mob remains configured below
      player_anchor: [0.5, 0.5] # Hero coordinate as [x, y] ratios inside the YOLO box
      player_offset: [0, 0]     # Optional pixel correction after applying player_anchor

  # Optional second anchor: the medal immediately below the character ID.
  # A partial ID may use a looser threshold only when this medal also matches
  # in the expected position. If its template is absent, detection falls back
  # to the original ID-only behavior.
  medal:
    enable: False
    name: ""                    # Empty loads nametag/<name>_medal.png
    diff_thres: 0.16            # Medal SQDIFF threshold; lower is stricter
    assisted_id_diff_thres: 0.24 # Maximum ID-fragment score with a valid medal
    id_fragment_width: 30       # Overlapping ID fragment width in pixels
    id_fragment_stride: 15      # Horizontal stride between ID fragments
    center_offset_x: 3          # Medal center relative to ID center
    vertical_gap: 0             # Medal top relative to the bottom of the ID
    search_tolerance: [18, 6]   # Allowed medal displacement [x, y]
    bottom_min_visible_ratio: 0.5 # At the camera bottom, require the medal's top half
    bottom_partial_diff_thres: 0.16 # SQDIFF threshold for that visible top half
    bottom_partial_id_diff_thres: 0.18 # Require a stronger ID with a clipped medal

  # Optional third anchor for frames where the ID is completely covered.
  # The pet name only opens a local medal search; pet coordinates are never
  # returned as the player position.
  pet:
    enable: False
    name: ""                    # Empty loads nametag/<name>_pet.png
    diff_thres: 0.16            # Pet-name SQDIFF threshold
    medal_offset: [37, 17]      # Medal top-left relative to pet-name top-left
    medal_search_tolerance: [28, 10]
    # When YOLO labels the pet as a mob, verify the configured pet name in the
    # narrow area immediately below that box and remove only that detection.
    # This avoids a broad player-area mask that could hide a real nearby mob.
    filter_yolo_mob: True
    yolo_name_diff_thres: 0.10   # Stricter than identity recovery matching
    yolo_name_vertical_gap: 3   # Expected pixels between pet box and pet name
    yolo_name_search_tolerance: [14, 8] # Local [x, y] tolerance around the box
    yolo_name_max_gap: 12        # Maximum actual gap from box bottom to name

  # Optional fourth anchor: the character's tiger hood/head. Under a freshly
  # detected Hero anchor, climbing vs standing templates determine ladder state.
  # Standing poses can also recover Hero when all text is covered; the less
  # distinctive climbing hood is restricted to a known local anchor or a
  # previously confirmed ladder position.
  appearance:
    enable: auto                 # Auto-load only templates for nametag.name
    diff_thres: 0.16            # Standing-head SQDIFF threshold
    climb_diff_thres: 0.12      # Stricter hood-only threshold
    local_search_radius: 90     # Search radius around an ID/previous position
    validation_distance: 30     # Maximum head-vs-ID player-coordinate error
    climb_validation_distance: 80 # Allow camera scrolling while on a rope
    global_confirm_frames: 2    # Consecutive frames before head-only recovery
    global_confirm_radius: 12   # Allowed movement between confirmation frames
    templates:
      - suffix: appearance_climb
        pose: climbing
        player_offset: [20, 38]
      - suffix: appearance_stand_left
        pose: standing
        player_offset: [18, 41]
      - suffix: appearance_stand_right
        pose: standing
        player_offset: [25, 39]

debug:
  # Vision-only mode: run the configured detector and never send input.
  # The settings below configure the legacy edge + color matcher, which is also
  # shared by normal debug_pipeline mode when the template backend is selected.
  monster_diff_thres: 0.30 # Edge correlation: higher is stricter
  monster_diff_thres_by_monster:
    snail: 0.30
  template_top_k: 1        # Keep only the best local maximum from each template
  local_peak_radius: 9     # Suppress dense neighboring hits before NMS
  verify_color: True       # Recheck edge candidates with normal-mode masked color matching
  color_verify_candidates: 5 # Check several peaks so one false peak cannot hide a real mob
  scan_interval_frames: 5  # Full-camera matching is expensive; reuse boxes between scans

character:
  # 🧍 Character
  # Your character's size in pixels.
  # ⚠️ Only used if monster_detect.mode is set to "template_free" —
  #    you can ignore this if using other detection modes.
  width: 100      # ↔️ Character width (in pixels)
  height: 150     # ↕️ Character height (in pixels)

monster_detect:
  # 🐌 Monster Detection
  # Automatically detect monsters around your character.
  # The 1024 YOLO backend replaces per-map sprite template matching.
  backend: "yolo"             # Options: "yolo" or legacy "template"
  model_path: "models/yolo/yolov8n_1024_rect_hero_mob_16000_v6_best.pt"
  imgsz: 1024                 # Must match the new model's intended inference size
  confidence: 0.40            # Minimum YOLO confidence
  iou: 0.70                   # YOLO NMS IoU threshold
  max_det: 100                # Maximum mob boxes per camera frame
  # Croko's 4K boxes are roughly 70-85 px high, or 23-28 px at the legacy
  # 1296x700 reference size. Keep the guard below that while still rejecting
  # the small bottom-UI fragments emitted by the model.
  min_box_width: 20           # Minimum YOLO box width at the reference resolution; 0 disables
  min_box_height: 20          # Minimum YOLO box height at the reference resolution; 0 disables
  device: "auto"             # CUDA device 0 when available, otherwise CPU
  half: True                  # FP16 on CUDA; automatically disabled on CPU
  warmup: True                # Initialize CUDA during config load, before control starts
  class_name: "mob"
  # Detection mode determines the method used to find monsters.
  # Settings below are retained only for backend: "template".
  # Modes ranked from most to least computational cost:
  #   - "debug_pipeline" (recommended; same edge + color matcher as debug)
  #   - "color"         (most accurate but slowest)
  #   - "grayscale"     (slow)
  #   - "contour_only"  (fast, contour-based, a good balance)
  #   - "template_free" (lightest and fastest, but likely to have many wrong detection)
  # 💡 Feel free to test different modes to find what works best for your setup.
  mode: "debug_pipeline"      # Options: "debug_pipeline" "color" "grayscale" "contour_only" "template_free"
  diff_thres: 0.8              # 📏 SQDIFF threshold, [0.0 ~ 1.0] Lower = stricter match
  # Per-class SQDIFF overrides shared by normal mode and debug color
  # verification. Small Wisdom Forest sprites need stricter color matches.
  diff_thres_by_monster:
    snail: 0.32
    slime: 0.34
    green_mushroom: 0.32
  local_min_radius: 9          # Suppress dense neighboring template matches before NMS
  max_candidates_per_template: 12 # Bound candidates so a loose threshold cannot stall normal mode
  merge_center_distance: 18   # Merge animation-template hits for the same nearby monster
  search_box_margin: 50        # ➕ Additional margin(in pixels) around the attack box for monster searching
  contour_blur: 5              # 🌫️ Gaussian blur kernel size used for contour smoothing (in "contour_only" mode).
  with_enemy_hp_bar: False     # Legacy template fallback; unused by YOLO
  hp_bar_color: [71, 204, 64]  # 💚 Enemy HP bar color (in BGR format)
  max_mob_area_trigger: 1500   # 📏 How much does the mob need to overlap with attack range to be considered as a target

channel_change:
  # 🔁 Auto change channel when other player detected
  # "true": Change channel once other player is detected
  # "pixel": Change channel once other player move set pixels in other_player_move_pixel
  enable: False                # ✅
  mode: "pixel"                # 🧠 Options: "true" "pixel"
  other_player_move_thres: 10  # 📏 only work in "pixel" mode

  ui_timeout: 60               # Stop and pause if channel UI does not advance.
  game_ready_timeout: 60       # Wait for minimap/player evidence after login.
  game_ready_confirm_frames: 2 # Require consecutive fresh gameplay frames.
  game_ready_poll_interval: 1

scheduled_channel_switching:
  # Schduel for channel swithcing
  enable: False            # Enable this feature or not
  interval_seconds: 1800   # Switch channel for every <interval_seconds> second

ui_coords:
  # 🧭 UI Coordinate
  # Buttons and menu cooridinate in game window
  # Expect all these coordinate is on orignal window size (get it from frame screenshot)
  ui_y_start: 610                       # 📐 UI y start
  "menu": [1140, 730]                   # 📐 Menu coordinate on game window UI
  "channel": [1140, 666]                # 📐 Channel button coordinate
  "random_channel": [877, 161]          # 📐 Random channel button in the channel selection menu
  "random_channel_confirm": [585, 420]  # 📐 Confirm button after clicking channel switch
  "select_character": [888, 275]        # 📐 Select character button during login
  login_button_thres: 0.05              # 📏 threshold to detect a login button on game window
  login_button_top_left: [838, 317]     # 📐 top left corner of login button search ragne
  login_button_bottom_right: [940, 373] # 📐 bottom right corner of login button search ragne

route:
  # 🧭 Route Following
  # The character follows a pre-defined route image (route*.png) using color-coded commands.
  search_range: 10            # 🔍 Route lookup radius; a nearby magenta stationary-jump marker triggers inside this distance
  ladder_endpoint_tolerance: 2 # Vertical-route endpoint tolerance in native minimap pixels
  ladder_alignment_tolerance: 2 # Require this x alignment before a ground Up/Down command; prevents nearby portal activation
  jump_down_cooldown: 3.0     # ⏱️ Cooldown (in seconds) for 'jump down' action to prevent continuous descent
  jump_up_settle_delay: 0.6   # 🛑 Seconds to stop horizontal movement before a stationary jump
  jump_alignment_nudge_ms: 30 # ↔️ Duration of each left/right centering pulse
  directional_jump_runup_ms: 180 # Minimum direction hold before a left/right jump; preserves rope-catching momentum
  # Draw an azure segment manually from the current platform toward the rope.
  # Seeing any part of that segment lets the bot predict its far endpoint as
  # the rope x, generate its own runway, and mount with a directional jump.
  rope_climb_detection_range: 10   # Distance from Hero to acquire a climb guide segment
  rope_climb_target_color: [0, 191, 255] # Explicit arrow-tip RGB; fixes the rope endpoint independently of Hero position
  rope_climb_arrow_bind_distance: 3 # Maximum pixels between an arrow tip and its light-blue guide
  rope_climb_runup_distance: 8     # Generated takeoff offset to the left/right of the rope
  rope_climb_align_tolerance: 1    # Accepted minimap x error at the generated takeoff point
  rope_climb_align_hold_distance: 6 # Hold direction outside this radius; use short correction pulses only nearby
  rope_climb_align_brake_delay: 0.10 # Release continuous movement before fine alignment
  rope_climb_align_crossing_tolerance: 3 # Accept a small overshoot instead of reversing into oscillation
  rope_climb_settle_delay: 0.15    # Reposition-only pause; skipped when already running toward the rope
  rope_climb_runup_ms: 180         # Minimum directional momentum before Up + Jump (existing run time counts)
  rope_climb_running_prediction_margin: 4 # Extra native minimap pixels added to one-frame motion prediction
  rope_climb_align_nudge_ms: 30    # Duration of each takeoff-position correction pulse
  rope_climb_position_timeout: 0.9 # Switch runway side if backing up makes no x progress
  rope_climb_retry_interval: 0.9   # Retry when an attempt produces no continued upward progress
  rope_climb_min_progress: 3       # Upward pixels required before an attempt counts as attached
  rope_climb_attach_x_tolerance: 3 # Maximum x error from the predicted rope while confirming the top
  rope_climb_finish_stall: 0.6     # Finish after this long stopped above the starting platform
  rope_climb_landing_tolerance: 2  # Treat a stalled attempt this close to start y as a miss
  rope_climb_max_attempts: 4       # Alternate/recalculate the run-up side up to this many times
  rope_climb_max_duration: 15.0    # Release control after an overall climb timeout
  rope_climb_failure_rearm_delay: 1.5 # Retry the same nearby guide after a bounded failure instead of waiting for watchdog movement
  rope_climb_failed_route_recovery_distance: 2 # After rearm delay, accept another route only when Hero is on/very near its stroke
  portal_sweep_nudge_ms: 30       # Horizontal TAP duration while Up remains held
  portal_sweep_edge_margin: 2     # Turn inward this many pixels before a block edge
  portal_sweep_repeat_interval: 0.2 # Minimum seconds between pulses on an unchanged frame
  portal_sweep_exit_distance: 10  # Minimum sudden minimap displacement for success
  portal_sweep_max_duration: 6.0  # Release control after a failed activation attempt

  # 🎨 Color-coded(RGB) actions for route navigation
  # "<left-right command, up-down command, action>"
  color_code:
    "255,0,0": "left none none"         # 🔴 Red
    "0,0,255": "right none none"        # 🔵 Blue
    "255,127,0": "left none jump"       # 🟠 Orange
    "0,255,255": "right none jump"      # 🟦 Cyan
    "127,255,0": "none down jump"       # 💚 Lime
    "255,0,255": "none none jump"       # 💜 Magenta
    "0,255,127": "stop stop stop"       # 🟢 Light green
    "255,255,0": "none none goal"       # 🟨 Yellow
    "255,0,127": "none up teleport"     # 🌸 Pink
    "127,0,255": "none down teleport"   # 🟪 Purple
    "0,127,0": "left none teleport"     # 🟩 Dark green
    "139,69,19": "right none teleport"  # 🟫 Brown
    "127,255,255": "none up portal"     # Light cyan portal region
    "0,127,255": "none up climb"        # Azure hand-drawn platform-to-rope guide

  # 🎨 Color-coded(RGB) actions for up and down
  color_code_up_down:
    "127,127,127": "none up none"       # ⚪ Gray
    "255,255,127": "none down none"     # 🟡 Light yellow

watchdog:
  # 🐶 Watchdog
  # This feature monitors your character's movement.
  # If the player stays in the same spot for too long, the watchdog will "bark"
  # and trigger a random action (defined in `color_code`) to help break the stuck state.
  # The other feature is last attack watch dog. It check if the player doesn't attack for too long.
  # If so, consider the player is stuck and perform recovery action 
  range: 10            # 🥶 Movement threshold (in pixels). If the player moves less than this, it's considered stuck.
  timeout: 10          # ⏱️ Time limit (in seconds). If the player stays still for this long, a random action is triggered.
  last_attack_timeout: 1200 # ⏳ Maximum time (in seconds) to not perform attack action
  last_attack_timeout_action: "change_channel" # 🧠 Options: "go_home" "change_channel"

rune_warning_cn:
  # ⚠️ Rune Warning Detection(Chinese)
  # Detects the "Please remove the rune" message on screen.
  # When this warning appears, the bot will pause combat and start searching for the rune instead.
  top_left: [513, 137]        # 🟦 Top-left corner of the rune warning message (img_frame coord)
  bottom_right: [768, 177]    # 🟥 Bottom-right corner of the rune warning (img_frame coord)
  diff_thres: 0.15            # 📏 Matching threshold [0.0 ~ 1.0], higher = stricter match

rune_warning_eng:
  # ⚠️ Rune Warning Detection(English)
  # Detects the "Please remove the rune" message on screen.
  # When this warning appears, the bot will pause combat and start searching for the rune instead.
  top_left: [432, 145]        # 🟦 Top-left corner of the rune warning message (img_frame coord)
  bottom_right: [864, 171]    # 🟥 Bottom-right corner of the rune warning (img_frame coord)
  diff_thres: 0.15            # 📏 Matching threshold [0.0 ~ 1.0], higher = stricter match

rune_enable_msg_cn:
  # ⚠️ Rune Enable Message(Chinese)
  # Detects the "Runes has been create" message on screen
  # When it appears, the bot will start detecting runes
  top_left: [559, 57]     # 📐 top left coordinate of rune enable msg (img_frame coord)
  bottom_right: [733, 87] # 📐 right bottom coordinate of rune enable msg (img_frame coord)
  diff_thres: 0.15         # 📏 Match threshold [0.0 ~ 1.0], higher = stricter match

rune_enable_msg_eng:
  # ⚠️ Rune Enable Message(English)
  # Detects the "Runes has been create" message on screen
  # When it appears, the bot will start detecting runes
  top_left: [460, 60]     # 📐 top left coordinate of rune enable msg (img_frame coord)
  bottom_right: [702, 83] # 📐 right bottom coordinate of rune enable msg (img_frame coord)
  diff_thres: 0.15         # 📏 Match threshold [0.0 ~ 1.0], higher = stricter match

rune_detect:
  # ✨ Rune Detection Box
  # This detects the glowing purple rune on screen.
  # The box determines how big of a region to search in the game screen.
  box_width: 350              # ↔️ Width of the detection region
  box_height: 150             # ↕️ Height of the detection region
  diff_thres: 0.2             # 📏 Match threshold [0.0 ~ 1.0], higher = stricter match
  debug     : False           # 🔍 Draw rune boxes or not

rune_find:
  # 🧭 Rune-Finding Behavior
  near_rune_duration: 10           # 🕒 Duration to interact with rune when a positive detection occurs
  rune_trigger_cooldown: 0.3       # 🕒 Cooldown for 'up' key rune trigger
  rune_trigger_distance_x: 20      # ↔️ only press 'up' when player distance(in pixel) to the rune is close enough.
  rune_trigger_distance_y: 200     # ↕️ only press 'up' when player distance(in pixel) to the rune is close enough.

rune_solver:
  # 🧩 Rune Mini-Game Solver
  # Keep disabled until all rune PNGs and 4K Hough/ROI geometry have been
  # re-recorded and calibrated per DIRECTSHOW_4K_ASSET_CHECKLIST.md.
  enable: False
  # When a rune is successfully triggered, a 4-arrow window game appears.
  # The rune_solver will automatically detect and match the best arrow pattern,
  # then press the correct direction key to solve the mini-game.
  arrow_box_size: 80           # 📐 Arrow icon size in pixels (e.g., 75x75 box)
  arrow_box_interval: 170      # ↔️ Distance between arrows (horizontal spacing in pixels)
  arrow_box_coord: [355, 296]  # 🎯 Top-left coordinate of the first (leftmost) arrow (img_frame coord)
  arrow_box_diff_thres: 0.2    # 📏 Match threshold [0.0 ~ 1.0]
                               #     ↪ If the match score of the first arrow is lower than this,
                               #     the solver assumes the rune mini-game has started
  arrow_low_hsv: [340, 40, 40]    # 🔴
  arrow_high_hsv: [110, 100, 100] # 🔴
  arrow_highlight_low_hsv: [340, 85, 85]    # 🔴
  arrow_highlight_high_hsv: [110, 100, 100] # 🔴

minimap:
  # 🗺️ Mini-Map
  # The minimap appears in the top-left corner of the game window.
  # It is used to estimate the player’s current location in the world.
  # Current capture-card center sample: RGB(255,255,136) -> BGR(136,255,255).
  player_color: [136, 255, 255]   # 🟡 BGR value of the yellow player dot on the minimap
  player_color_tolerance: 10      # Tight tolerance avoids nearby yellow artwork
  player_min_component_area: 2    # HDMI scaling can reduce the marker to 2 pixels
  other_player_color: [0, 0, 255] # 🔴 BGR value of the red other player dot on the minimap
  # Route matching uses the captured minimap's native raster without resizing.
  # A map and all of its route images must therefore be recorded with the same
  # capture resolution and in-game minimap/UI scale used during automation.
  debug_window_upscale: 4         # 🔍 Zoom factor for the route debug image (for visualization only)
  debug_window_max_screen_ratio: 0.85  # Keep the complete growing route preview on screen
  offset: [0, 0]                  # 📐 Don't set this unless playing on global server

patrol:
  # 🚶‍♂️ Patrol Mode
  # In this mode, the player will walk back and forth and attack periodically.
  # It doesn't rely on monster detection or a minimap — just pure action!
  range: [0.2, 0.8]               # ↔️ [0.0 ~ 1.0] Patrol boundaries (relative to screen width)
                                  #     - 0.0 = Left edge of the game window
                                  #     - 1.0 = Right edge
                                  # The player will turn back once reaching these bounds.
  turn_point_thres: 10            # 🔁 Number of consecutive frames required to confirm a turn point
  patrol_attack_interval: 2.5     # 🕒 Time in seconds between each attack while patrolling

route_recoder:
  # 🎥 Route Recorder
  # The route recorder is a standalone tool that helps generate `map.png` and `route*.png`.
  # It records the player's movement and actions, then saves them as a route map image.
  blob_cooldown: 0.7        # ⏱️ Cooldown in seconds between recording actions like 'jump' or 'teleport'
                            #     These actions are marked as a "blob" on the route map
  map_padding: 30           # 🖤 Padding (in pixels) added as margin around the edge of the map
  # Mirror A's gameplay keys to the ESP32/B computer while recording. F1-F4
  # always remain local recorder controls. Add uncommon gameplay keys below.
  minimap_lock_frames: 5    # Lock the session crop to the median of these detections
  forward_input_to_esp32: True
  forward_keys: []
  # Keep matching near the previous camera offset. Repeating platforms can
  # otherwise produce a low SQDIFF score on the wrong floor.
  local_search_radius: 35
  local_match_threshold: 0.22
  global_match_threshold: 0.22
  # A distant global match is accepted immediately when its score is better
  # than the local candidate by at least this amount (for in-map portals).
  teleport_score_margin: 0.03
game_window:
  capture_profile: "capture_card" # DirectShow 4K native passthrough.
  # Settings below retain an optional legacy window/PotPlayer fallback.
  # PotPlayer uses a client-drawn skin, so remove its chrome before
  # normalizing the HDMI video to the original 1282x693 game raster.
  potplayer_chrome_top: 34
  potplayer_chrome_bottom: 65
  potplayer_chrome_left: 0
  potplayer_chrome_right: 0
  potplayer_video_aspect_ratio: [16, 9]
  # Calibrated against minimaps/fire_land_1/map.png with the current skin.
  # This leaves a 2768x1557 (16:9) video viewport; its live minimap raster
  # matches the route recording's effective 260x142 map content closely.
  potplayer_resize_width: 2768
  potplayer_resize_height: 1656
  # 🪟 Legacy Game Window / Target Program
  # Used only when capture.source is "window" (or by offline test images).
  title: "MapleStory Worlds"   # 🎮 Target window title (substring match by default)
  exact_match: False           # 🎯 True = require the full title to match exactly, False = substring match
  size: [693, 1282]            # Legacy direct-window size; ignored by capture_card.
  # Frame-space configuration below was authored against this legacy raster.
  # Native 4K capture scales those coordinates from this reference.
  coordinate_reference_size: [700, 1296]
  preserve_native_resolution: False # Legacy PotPlayer-only compatibility switch.
  ratio_tolerance: 0.08        # 📐 Game window 16:9 tolerance
  title_bar_height: 59         # 📐 Title Bar Height (Note it's before window resize)
  auto_resize: True            # 🔧 Force-resize the target window on capture start.
                               #     Set to False for programs that must NOT be resized
                               #     (e.g. windows already at the right size, or apps that
                               #      break/reset when moved). Aux mode only needs 16:9.
  resize_width: 1296           # 📐 Target window width (incl. borders) when auto_resize is True
  resize_height: 759           # 📐 Target window height (incl. title bar) when auto_resize is True
  frame_timeout: 1.0           # 🛑 Release remote input if captured video stops updating.

email:
  # 📩 Email
  # Experimental email notification settings.
  # Never commit real credentials. tools/email_test.py reads credentials from
  # MAPLE_BOT_SENDER_EMAIL, MAPLE_BOT_EMAIL_PASSWORD, and
  # MAPLE_BOT_RECEIVER_EMAIL environment variables.
  enable: False
  sender_email: ""
  sender_password: ""
  receiver_email: ""

system:
  # ⚙️ System Settings
  # Controls performance and behavior of core system threads.
  fps_limit_main: 10                # 🚥 Main loop FPS – controls how fast the main thread runs
  fps_limit_ui_viz: 5               # UI preview only; detection remains at native resolution
  ui_viz_max_size: [720, 1280]      # [height, width] sent to Qt to avoid flooding its event queue
  fps_limit_keyboard_controller: 30 # 🚥 Keyboard controller thread FPS
  fps_limit_window_capturor: 15     # 🚥 Window capture thread FPS
  fps_limit_route_recorder: 10      # 🚥 Route recorder FPS
  fps_limit_auto_dice_roller: 1     # 🚥 Auto rice roller FPS
  key_debounce_interval: 1          # ⏱️ Cooldown (in seconds) between function key presses (e.g., F1, F2...)
  server: "TW"                      # ⚙️ Options: "TW" "NA"
  language: "cn"                    # ⚙️ Options: "eng" "cn"

profiler:
  # ⚙️ Profiler
  # For FPS/performance debugging
  # When the FPS is lower than 5, please use profiler to find which code block is costing more time 
  enable: False       # ✅ To print the profiler result or not
  print_frequency: 30 # Print profiler result for every 30 frames
