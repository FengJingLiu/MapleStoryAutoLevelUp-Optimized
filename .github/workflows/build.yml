name: Build Windows EXE and Upload to Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==2.7.1+cu128 torchvision==0.22.1+cu128 --index-url https://download.pytorch.org/whl/cu128
        python -m pip install -r requirements.txt

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile src/main.py -p . -n MapleStoryAutoLevelUp --icon=media/icon.ico --hidden-import=pkg_resources.py2_warn --hidden-import=pkg_resources.extern --collect-submodules serial --additional-hooks-dir=pyinstaller_hooks --collect-all ultralytics --add-data "models/yolo/mob_1024_best.pt;models/yolo"

    - name: Package files into zip
      run: |
        mkdir release
        cp dist/MapleStoryAutoLevelUp.exe release/
        cp README.md release/
        cp -r config release/
        cp -r minimaps release/
        cp -r monster release/
        cp -r nametag release/
        cp -r rune release/
        cp -r misc release/
        cp -r models release/
        # Add whatever else your exe needs to run
        powershell Compress-Archive -Path release/* -DestinationPath MapleStoryAutoLevelUp.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: MapleStoryAutoLevelUp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
